name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: glamflow
          POSTGRES_USER: glamflow
          POSTGRES_PASSWORD: glamflow
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://glamflow:glamflow@localhost:5432/glamflow
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate --workspace=@glamflow/database
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:js
      - run: npm test
      - run: npm run deploy --workspace=@glamflow/database
      - run: npm run build

  docker:
    name: Docker build
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=$(echo \"${{ github.repository_owner }}\" | tr \"[:upper:]\" \"[:lower:]\")" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/glamflow-web:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/glamflow-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/glamflow-worker:${{ github.sha }}
